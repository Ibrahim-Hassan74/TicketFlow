name: CD Pipeline (Deploy & Push)

on:
  push:
    branches: ["master", "feature/ci-cd-pipeline"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # Job 1: Deploy to MonsterASP.NET via WebDeploy
  deploy-to-monsterasp:
    name: Deploy to MonsterASP.NET
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore TicketFlow.slnx

      - name: Build Solution
        run: dotnet build TicketFlow.slnx --configuration Release --no-restore

      - name: Publish API Project
        run: dotnet publish TicketFlow.API/TicketFlow.API.csproj --configuration Release --output "${{ github.workspace }}/publish" --runtime win-x86

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: 'publish'

  # Job 2: Build & Push Docker Image to Docker Hub
  push-to-dockerhub:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-api:${{ github.sha }}
