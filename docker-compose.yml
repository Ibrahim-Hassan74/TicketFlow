services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-flow-api
    ports:
      - "${API_HTTP_PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticketflow_db};Username=${POSTGRES_USER:-ticketflow};Password=${POSTGRES_PASSWORD:-YourStrong@PostgresPass123};}
      - Jwt__Issuer=${JWT_ISSUER:-https://ticket-flow.api}
      # NOTE: The default key below is an EXAMPLE for development/testing only.
      # For production, generate a strong secret and set JWT_KEY in your .env file.
      - Jwt__Key=${JWT_KEY:-V9AUi93Un0mh8hpNj/dC19I83Eu9xZLdsvDNKbniS1bRnQaVuKb+1vRRd03l1k0HQ5mjab0sHHdmEnYmD3pWgQ==}
      - Jwt__Audiences__0=${JWT_AUDIENCE_0:-https://localhost:4200}
      - Jwt__Audiences__1=${JWT_AUDIENCE_1:-postman-client}
      - Jwt__EXPIRATION_MINUTES=${JWT_EXPIRATION_MINUTES:-30}
      - RefreshToken__EXPIRATION_MINUTES=${REFRESH_TOKEN_EXPIRATION_MINUTES:-500}
      - RefreshToken__LONG_EXPIRATION_MINUTES=${REFRESH_TOKEN_LONG_EXPIRATION_MINUTES:-2880}
      - AllowedOrigins__0=${ALLOWED_ORIGIN_0:-https://ticket--hub.web.app}
      - AllowedOrigins__1=${ALLOWED_ORIGIN_1:-https://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticket-flow-net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ticket-flow-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ticketflow_db}
      - POSTGRES_USER=${POSTGRES_USER:-ticketflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-YourStrong@PostgresPass123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./TicketFlow.Infrastructure/Persistence/Scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketflow} -d ${POSTGRES_DB:-ticketflow_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ticket-flow-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  ticket-flow-net:
    driver: bridge
